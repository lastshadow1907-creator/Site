<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muly ❤️ Olcay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Pacifico&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --ana: #ff4757; 
            --bg-top: #1a0303; 
            --bg-bottom: #3d0e0e;
            --card: rgba(35, 10, 10, 0.55); 
            --text: #ffffff; 
            --accent: #ff7f50;
            --neon-glow: rgba(255, 71, 87, 0.4);
        }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 50%, #120202 100%);
            background-attachment: fixed;
            margin: 0; padding: 20px 15px; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; color: var(--text); padding-bottom: 60px; 
            -webkit-font-smoothing: antialiased;
        }

        h1 { 
            font-family: 'Pacifico'; 
            font-size: 2.4rem; 
            margin: 15px 0 25px 0; 
            text-shadow: 0 4px 20px rgba(255, 71, 87, 0.3);
            background: linear-gradient(45deg, #fff, #ff7f50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card { 
            background: var(--card); 
            width: 92%; max-width: 380px; 
            border-radius: 24px; padding: 35px 20px; 
            text-align: center; 
            box-shadow: 0 25px 45px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-sizing: border-box;
        }

        #gun { 
            font-size: 4rem; 
            font-weight: 800; 
            color: var(--ana); 
            line-height: 1; 
            text-shadow: 0 0 25px var(--neon-glow); 
            letter-spacing: -1px;
        }
        
        #saat { 
            font-size: 1.6rem; 
            font-weight: 700; 
            color: var(--accent); 
            letter-spacing: 3px; 
            margin-top: 15px;
            opacity: 0.9;
        }
        
        .quote { font-family: 'Dancing Script', cursive; font-size: 1.3rem; opacity: 0.8; margin-top: 20px; color: #ffb3b3; }

        /* 🗓️ 30 GÜNLÜK DÖNGÜYE UYGUN YENİ AY KUTUSU */
        .ay-sayac-box {
            background: rgba(0, 0, 0, 0.3);
            width: 92%; max-width: 380px;
            margin-top: 15px; padding: 15px;
            border-radius: 18px;
            border: 1px dashed rgba(255, 127, 80, 0.4);
            text-align: center;
            box-sizing: border-box;
        }
        #ay-hedef-text { font-size: 0.95rem; font-weight: 600; color: #ffffff; }
        #ay-kalan-gun { font-size: 1.2rem; font-weight: 800; color: var(--ana); margin-top: 5px; text-shadow: 0 0 10px rgba(255,71,87,0.3); }

        .kalpler { display: flex; gap: 35px; margin: 30px 0; justify-content: center; }
        .k-container { display: flex; flex-direction: column; align-items: center; }
        .k-btn { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.1); 
            cursor: pointer; 
            font-size: 3rem; 
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .k-btn:active { transform: scale(1.15) rotate(10deg); background: rgba(255,71,87,0.2); }
        .k-label { font-size: 1.2rem; font-weight: 700; color: #ffffff; font-family: 'Dancing Script', cursive; margin-top: 8px; opacity: 0.9; }

        .game-btn { 
            background: linear-gradient(135deg, var(--ana) 0%, #ff6b81 100%); 
            color: white; border: none; padding: 16px; 
            border-radius: 50px; font-weight: 700; font-size: 1rem;
            cursor: pointer; width: 100%; margin-top: 15px; 
            box-shadow: 0 8px 25px rgba(255,71,87,0.4); 
            transition: 0.3s ease;
            letter-spacing: 1px;
        }
        .game-btn:active { transform: scale(0.98); box-shadow: 0 4px 10px rgba(255,71,87,0.2); }

        .tabs { 
            display: flex; 
            background: rgba(0,0,0,0.4); 
            border-radius: 50px; 
            margin: 25px 0 15px 0; 
            width: 92%; max-width: 380px; 
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .tab { 
            flex: 1; padding: 14px; border: none; background: none; 
            font-weight: 700; font-size: 0.95rem; color: rgba(255,255,255,0.4); 
            cursor: pointer; border-radius: 50px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .tab.active { background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); }

        .not-item { 
            background: linear-gradient(135deg, rgba(40, 15, 15, 0.6) 0%, rgba(25, 8, 8, 0.7) 100%); 
            margin: 15px 0; padding: 22px; 
            border-radius: 20px; width: 92%; max-width: 380px;
            position: relative; 
            border-left: 4px solid var(--ana); 
            text-align: left; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.03);
        }

        .not-tarih {
            font-size: 0.75rem;
            font-weight: 800;
            color: #ffffff;
            background: rgba(255, 127, 80, 0.2);
            padding: 4px 10px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: inline-block;
            border: 1px solid rgba(255, 127, 80, 0.2);
        }

        .not-metin { font-size: 1.05rem; color: #f0f0f0; line-height: 1.6; word-wrap: break-word; font-weight: 400; }

        .del-btn { 
            position: absolute; 
            top: 18px; right: 18px; 
            background: rgba(0,0,0,0.4); 
            color: rgba(255,255,255,0.6); 
            border-radius: 50%; 
            width: 26px; height: 26px; 
            border: 1px solid rgba(255,255,255,0.1); 
            font-weight: normal; cursor: pointer; 
            z-index: 99; display: flex; align-items: center; justify-content: center; 
            font-size: 14px; transition: 0.2s;
        }
        .del-btn:active { background: var(--ana); color: white; border-color: transparent; }

        .not-input-container { width: 92%; max-width: 380px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .not-date-input {
            width: 100%; padding: 12px 15px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(0, 0, 0, 0.3); color: white;
            font-family: 'Poppins'; font-size: 0.9rem; box-sizing: border-box;
            outline: none; transition: 0.3s;
        }
        .not-date-input:focus { border-color: var(--accent); }

        .not-input { 
            width: 100%; padding: 18px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.08); 
            background: rgba(0, 0, 0, 0.3); color: white; 
            box-sizing: border-box; resize: none; font-family: 'Poppins';
            font-size: 0.95rem; transition: 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .not-input:focus { outline: none; border-color: var(--ana); background: rgba(0,0,0,0.4); }
        
        .galeri-sayfasi {
            display: none; position: fixed; inset: 0;
            background: linear-gradient(180deg, #0f0202 0%, #240707 100%);
            z-index: 5000; overflow-y: auto;
            padding: 25px 15px 90px 15px;
            flex-direction: column; align-items: center;
        }

        .galeri-baslik-alani {
            width: 100%; max-width: 380px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
        }
        .galeri-baslik { font-family: 'Pacifico'; font-size: 1.8rem; color: white; margin: 0; }
        .geri-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 10px 20px; border-radius: 30px;
            font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .geri-btn:active { background: var(--ana); border-color: transparent; }

        .buyuk-galeri-listesi { display: flex; flex-direction: column; gap: 25px; width: 100%; max-width: 380px; }

        .photo-card-big {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px; padding: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative; backdrop-filter: blur(10px);
        }
        .photo-card-big img { width: 100%; height: auto; max-height: 480px; object-fit: cover; border-radius: 16px; display: block; cursor: zoom-in; }

        .floating-ctrl { position: fixed; bottom: 30px; right: 25px; z-index: 6000; }
        .circle-btn { 
            width: 68px; height: 68px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: linear-gradient(135deg, var(--ana) 0%, #ff6b81 100%); 
            color: white; display: flex; align-items: center; justify-content: center; 
            font-size: 28px; cursor: pointer; 
            box-shadow: 0 10px 30px rgba(255,71,87,0.5);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .circle-btn:active { transform: scale(0.9) rotate(-15deg); }

        .lightbox {
            display: none; position: fixed; z-index: 10000; inset: 0;
            background: rgba(5,2,2,0.97); align-items: center; justify-content: center; cursor: zoom-out;
        }
        .lightbox img { max-width: 95%; max-height: 85vh; border-radius: 14px; box-shadow: 0 0 40px rgba(255,71,87,0.2); }

        #loading { display:none; position:fixed; inset:0; background:rgba(10,3,3,0.92); color:white; z-index:9999; align-items:center; justify-content:center; flex-direction: column; gap: 15px; font-size: 1.2rem; font-weight:600; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <div id="loading">✨ Aşkımız Yükleniyor... ❤️</div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Büyük Önizleme">
    </div>

    <h1>Muly ❤️ Olcay</h1>

    <div class="card">
        <div id="gun">...</div>
        <div id="saat">00 : 00 : 00</div>
        <div class="quote">Sonsuza dek sürecek bir aşk hikayesi...</div>
    </div>

    <div class="ay-sayac-box">
        <div id="ay-hedef-text">Yükleniyor...</div>
        <div id="ay-kalan-gun">...</div>
    </div>

    <div class="kalpler">
        <div class="k-container"><button onclick="at('M')" class="k-btn">💖</button><div class="k-label">Muly</div></div>
        <div class="k-container"><button onclick="at('O')" class="k-btn">💝</button><div class="k-label">Olcay</div></div>
    </div>

    <div class="tabs">
        <button id="t1" class="tab" onclick="tab('g')">🖼️ Galeri</button>
        <button id="t2" class="tab active" onclick="tab('a')">✍️ Anılar</button>
    </div>

    <div id="not-input-area" class="not-input-container">
        <input type="date" id="notDate" class="not-date-input">
        <textarea id="notTxt" class="not-input" rows="3" placeholder="Anını buraya bırak... ❤️"></textarea>
        <button class="game-btn" onclick="saveNote()">Anıyı Kaydet</button>
    </div>

    <div id="as" style="display:flex; width:100%; flex-direction:column; align-items:center;"></div>

    <div id="galeriSayfasi" class="galeri-sayfasi">
        <div class="galeri-baslik-alani">
            <h2 class="galeri-baslik">Fotoğraflarımız ❤️</h2>
            <button class="geri-btn" onclick="kapatGaleriSayfasi()">← Geri Dön</button>
        </div>
        <div id="gs" class="buyuk-galeri-listesi"></div>
    </div>

    <div class="floating-ctrl">
        <input type="file" id="fotoInput" style="display:none;" accept="image/*" onchange="uploadPhoto(this)">
        <div class="circle-btn" onclick="document.getElementById('fotoInput').click()">📸</div>
    </div>

    <script>
        const T = '8679884252:AAExbOnyIg_MNFv00NRnW79-vtlH5KB6j0w';
        const M_ID = '8697863466'; 
        const O_ID = '6555602691'; 
        const S = '1JgcElY-IQEvViAZjivDtZPhzDJqE6kwetokPrnR-Kjk';
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbwi-0o6xAFHr8DlkR6BWPYiA9bDK2ecghWt_uUdvBsazcdVzU9BoNtLafblCXK27ZjTKA/exec';
        const start = new Date(2026, 2, 14, 0, 8, 0); // 14 Mart 2026

        function at(k) {
            let msg = ""; let target = "";
            if(k === 'M') { msg = "Muly seni çok özledi Olcay"; target = O_ID; } 
            else { msg = "Olcayın yine aklındasın. Pardon ne zaman çıktın ki?"; target = M_ID; }
            fetch(`https://api.telegram.org/bot${T}/sendMessage?chat_id=${target}&text=${encodeURIComponent(msg)}`);
        }

        function getSecilenVeyaBugunTarih() {
            const dateInput = document.getElementById('notDate').value;
            let d;
            if (dateInput) { d = new Date(dateInput); } else { d = new Date(); }
            return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
        }

        async function saveNote() {
            const val = document.getElementById('notTxt').value;
            if(!val) return;
            document.getElementById('loading').style.display = 'flex';
            const secilenTarih = getSecilenVeyaBugunTarih();
            const formatliNot = `📅 ${secilenTarih} | ${val}`;
            await fetch(`${scriptUrl}?ani=${encodeURIComponent(formatliNot)}&foto=`, {mode:'no-cors'});
            document.getElementById('notTxt').value = "";
            document.getElementById('notDate').value = "";
            load();
            document.getElementById('loading').style.display = 'none';
        }

        async function uploadPhoto(input) {
            if(!input.files[0]) return;
            document.getElementById('loading').style.display = 'flex';
            const fd = new FormData(); fd.append('image', input.files[0]);
            const res = await fetch('https://api.imgbb.com/1/upload?key=81c9056d649d8ec38029019623e1373a', {method:'POST', body:fd});
            const d = await res.json();
            if(d.success) {
                await fetch(`${scriptUrl}?ani=&foto=${encodeURIComponent(d.data.url)}`, {mode:'no-cors'});
                load();
            }
            document.getElementById('loading').style.display = 'none';
        }

        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }
        
        function kapatGaleriSayfasi() {
            document.getElementById('galeriSayfasi').style.display = 'none';
            tab('a');
        }

        async function load() {
            const r = await fetch(`https://docs.google.com/spreadsheets/d/${S}/gviz/tq?tqx=out:csv&v=${Math.random()}`);
            const data = await r.text();
            const lines = data.split('\n').slice(1);
            const g = document.getElementById('gs'), a = document.getElementById('as');
            g.innerHTML = ""; a.innerHTML = "";
            
            lines.forEach((l, i) => {
                const c = l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                let txt = c[0]?.replace(/"/g,''), img = c[1]?.replace(/"/g,'');
                
                if(img && img.includes('http')) {
                    g.insertAdjacentHTML('afterbegin', `
                        <div class="photo-card-big">
                            <button class="del-btn" onclick="del(${i+2})">×</button>
                            <img src="${img}" onclick="openLightbox('${img}')" alt="Büyük Fotoğraf">
                        </div>
                    `);
                } else if(txt && txt.trim() !== "") {
                    let tarih = "BİLİNMEYEN TARİH";
                    let temizMetin = txt;
                    
                    if(txt.includes('|')) {
                        const parca = txt.split('|');
                        tarih = parca[0].replace('📅', '').trim();
                        temizMetin = parca.slice(1).join('|').trim();
                    }

                    a.insertAdjacentHTML('afterbegin', `
                        <div class="not-item">
                            <button class="del-btn" onclick="del(${i+2})">×</button>
                            <span class="not-tarih">📅 ${tarih}</span>
                            <div class="not-metin">${temizMetin}</div>
                        </div>
                    `);
                }
            });
        }

        async function del(id) {
            if(!confirm("Bunu siliyorum, emin misin?")) return;
            document.getElementById('loading').style.display = 'flex';
            await fetch(`${scriptUrl}?del=${id}`, {mode:'no-cors'});
            load();
            document.getElementById('loading').style.display = 'none';
        }

        function tab(x) {
            if (x === 'g') {
                document.getElementById('galeriSayfasi').style.display = 'flex';
                document.getElementById('as').style.display = 'none';
                document.getElementById('not-input-area').style.display = 'none';
                document.getElementById('t1').classList.add('active');
                document.getElementById('t2').classList.remove('active');
            } else {
                document.getElementById('galeriSayfasi').style.display = 'none';
                document.getElementById('as').style.display = 'flex';
                document.getElementById('not-input-area').style.display = 'flex';
                document.getElementById('t1').classList.remove('active');
                document.getElementById('t2').classList.add('active');
            }
        }

        // 🗓️ TAM 30 GÜNDE BİR AY SAYAN YENİ GELİŞMİŞ SİSTEM
        function update30GunlukAySayaci(gecenMilisaniye) {
            const gunler = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
            const simdi = new Date();
            
            // Toplam kaç tam gün geçmiş
            const gecenToplamGun = Math.floor(gecenMilisaniye / 86400000);
            
            // Şu an kaçıncı 30 günlük döngünün içindesiniz (Örn: 0-29 gün arası 1. ay, 30-59 arası 2. ay)
            const suAnkiAy = Math.floor(gecenToplamGun / 30) + 1;
            const gelecekAy = suAnkiAy + 1;
            
            // Bir sonraki ay dönümü için gereken toplam gün hedefi (Örn: 2. ay için 30. gün, 3. ay için 60. gün)
            const hedefToplamGun = (suAnkiAy) * 30;
            
            // Hedef güne kalan tam gün sayısı
            const kalanGun = hedefToplamGun - gecenToplamGun;
            
            // Gelecek 30. günün tam tarihini bulup hangi gün olduğunu öğrenme
            const gelecekAyDonumuTarihi = new Date(start.getTime() + (hedefToplamGun * 86400000));
            const gunAdi = gunler[gelecekAyDonumuTarihi.getDay()];
            
            document.getElementById('ay-hedef-text').innerText = `✨ Şu an ${suAnkiAy}. Ayın İçindesiniz`;
            document.getElementById('ay-kalan-gun').innerText = `⏳ ${gelecekAy}. Aya ${kalanGun} gün kaldı (${gunAdi})`;
        }

        function count() {
            const f = new Date() - start;
            const d = Math.floor(f/86400000), h = Math.floor((f%86400000)/3600000), m = Math.floor((f%3600000)/60000), s = Math.floor((f%60000)/1000);
            document.getElementById('gun').innerText = d + " GÜN";
            document.getElementById('saat').innerText = `${String(h).padStart(2,'0')} : ${String(m).padStart(2,'0')} : ${String(s).padStart(2,'0')}`;
            
            // 30 günlük periyodu tetikle
            update30GunlukAySayaci(f);
        }

        window.onload = () => { load(); setInterval(count, 1000); tab('a'); };
    </script>
</body>
</html>
